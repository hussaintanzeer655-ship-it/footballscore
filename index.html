<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PitchPulse — Football Scores & Stats</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{--bg:#070b14;--card:rgba(255,255,255,.06);--bd:rgba(255,255,255,.1);--tx:#f1f5f9;--mut:#8b9ab3;--acc:#22d3a0;--accx:#04120d;--side:rgba(8,13,25,.85);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#eef2f8;--card:rgba(255,255,255,.75);--bd:rgba(15,23,42,.12);--tx:#0f172a;--mut:#51607a;--accx:#fff;--acc:#0a8f68;--side:rgba(255,255,255,.9);color-scheme:light}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(900px 500px at 85% -10%,rgba(34,211,160,.14),transparent),radial-gradient(700px 500px at -10% 30%,rgba(99,102,241,.14),transparent),var(--bg);color:var(--tx);min-height:100vh}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.mut{color:var(--mut)}
.chip{padding:6px 14px;border-radius:99px;border:1px solid var(--bd);font-size:13px;cursor:pointer;white-space:nowrap;background:var(--card);color:var(--tx)}
.chip.on{background:var(--acc);color:var(--accx);border-color:transparent;font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:#ef4444;display:inline-block;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.7)}100%{box-shadow:0 0 0 9px rgba(239,68,68,0)}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.live{color:#ef4444;font-weight:700;display:inline-flex;gap:6px;align-items:center}
#main>*{animation:fade .3s ease}
.hov{cursor:pointer;transition:.2s}.hov:hover{transform:translateY(-2px);border-color:var(--acc)}
.fb{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;font-size:11px;font-weight:700;color:#fff;margin-right:3px}
.fbW{background:#16a34a}.fbD{background:#64748b}.fbL{background:#dc2626}
.tab{padding:10px 14px;font-size:14px;font-weight:600;color:var(--mut);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--acc);border-color:var(--acc)}
.bar{height:6px;border-radius:9px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%}
.pitch{position:relative;aspect-ratio:3/4;max-width:480px;margin:auto;border-radius:16px;border:2px solid rgba(255,255,255,.45);background:repeating-linear-gradient(#1f7a46 0 10%,#1b6e3f 10% 20%);overflow:hidden}
.pitch:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid rgba(255,255,255,.45)}
.pitch:after{content:"";position:absolute;left:50%;top:50%;width:90px;height:90px;margin:-45px;border:2px solid rgba(255,255,255,.45);border-radius:50%}
.pl{position:absolute;transform:translate(-50%,-50%);text-align:center;cursor:pointer;width:62px;z-index:2}
.pl b{display:grid;place-items:center;width:30px;height:30px;margin:auto;border-radius:50%;font-size:12px;border:2px solid #fff}
.pl i{font-style:normal;font-size:10px;font-weight:700;background:#0008;color:#fff;border-radius:6px;padding:0 4px;display:inline-block}
.pl small{display:block;font-size:10px;color:#fff;text-shadow:0 1px 2px #000}
table{width:100%;border-collapse:collapse;font-size:13px}th{color:var(--mut);font-weight:600;text-align:right;padding:8px 6px}td{padding:9px 6px;text-align:right;border-top:1px solid var(--bd)}
th:nth-child(2),td:nth-child(2){text-align:left}tr[data-go]{cursor:pointer}tr[data-go]:hover{background:var(--card)}
#bnav{padding-bottom:env(safe-area-inset-bottom,0px)}
.nv{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;color:var(--mut);font-weight:600;font-size:14px;text-decoration:none}
.nv.on{background:var(--card);color:var(--acc)}
.scroll{overflow-x:auto}
</style>
</head>
<body>
<aside class="hidden md:flex flex-col fixed left-0 top-0 h-full w-60 p-4 gap-1 z-20" style="background:var(--side);border-right:1px solid var(--bd);backdrop-filter:blur(16px);padding-top:calc(16px + env(safe-area-inset-top,0px))">
  <div class="text-xl font-extrabold px-2 mb-5">⚽ Pitch<span style="color:var(--acc)">Pulse</span></div>
  <a class="nv" data-n="hub" href="#/">📺 Scores</a><a class="nv" data-n="table" href="#/table">🏆 Standings</a><a class="nv" data-n="stats" href="#/stats">📊 Stats</a><a class="nv" data-n="teams" href="#/teams">🛡️ Clubs</a>
  <div class="mut text-xs mt-auto px-2">Simulated data · runs fully offline</div>
</aside>
<nav id="bnav" class="md:hidden fixed bottom-0 inset-x-0 z-20 flex justify-around" style="background:var(--side);border-top:1px solid var(--bd);backdrop-filter:blur(16px)">
  <a class="nv" data-n="hub" href="#/">📺 Scores</a><a class="nv" data-n="table" href="#/table">🏆 Table</a><a class="nv" data-n="stats" href="#/stats">📊 Stats</a><a class="nv" data-n="teams" href="#/teams">🛡️ Clubs</a>
</nav>
<main id="main" class="md:ml-60 p-4 md:p-8 pb-28 md:pb-10 max-w-6xl mx-auto"></main>

<script>

const R=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

const T=[
{id:"rbu",n:"Redbridge United",s:"RBU",c:"#e11d48",tc:"#fff",lk:"Premier League",f:"4-3-3",v:"Redbridge Park",m:"Alan Whitcombe",form:"WWDWW"},
{id:"ngf",n:"Northgate FC",s:"NGF",c:"#2563eb",tc:"#fff",lk:"Premier League",f:"4-2-3-1",v:"Northgate Arena",m:"Stefan Brandl",form:"WLWWD"},
{id:"hbc",n:"Harbor City",s:"HBC",c:"#38bdf8",tc:"#06283d",lk:"Premier League",f:"4-3-3",v:"Harbor Stadium",m:"Joaquin Medina",form:"DWWLW"},

const TM={},P={};
T.forEach((t,ti)=>{TM[t.id]=t;t.sq=[];let k=0;
SQ.forEach(([pos,n,nums])=>{for(let j=0;j<n;j++){const ix=ti*18+k++,r=R(ix*131+7),rr=(a,b)=>a+Math.floor(r()*(b-a+1));

const p={id:t.id+ix,t:t.id,pos,num:nums[j],n:FN[(ix*7+Math.floor(ix/30)*3)%20]+" "+LN[ix%30],age,nat:NA[rr(0,9)],foot:r()<.72?"Right":"Left",
val:"€"+Math.max(2,Math.round((ovr-48)*(2.2-(age-19)*.05)*(.6+r())))+"M",ap:rr(7,9),g,a:as,xg:+(g*(.8+r()*.5)+(pos=="FW"?.6:.2)).toFixed(1),
pp:rr(70,92),tk:rr(pos=="DF"?64:46,pos=="DF"?82:70),yc:rr(0,3),rc:r()<.08?1:0,at,rt:+(6.3+r()*1.9).toFixed(1),
log:[0,1,2,3,4].map(i=>({o:T[(ti+1+i)%6].s,res:["W","D","L"][rr(0,2)],rt:+(5.6+r()*3.4).toFixed(1),g:pos=="FW"&&r()<.4?1:pos=="MF"&&r()<.2?1:0,a:pos!="GK"&&pos!="DF"&&r()<.3?1:0}))};
t.sq.push(p);P[p.id]=p}});

const FR={"4-3-3":[1,4,3,3],"4-2-3-1":[1,4,2,3,1]};
/* fixtures: ev=[min,type,side,xiSlot,assistSlot]; s=[poss,xgH,xgA,sotH,sotA,passH,passA,cornH,cornA,foulH,foulA] (full-time values) */
const F=[
{id:"f1",lg:"Premier League",h:"rbu",a:"ngf",st:"LIVE",min:62,hs:1,as:1,day:"Today",time:"17:30",ref:"M. Oliver-Hayes",att:"60,214",

{id:"f5",lg:"Premier League",h:"ngf",a:"hbc",st:"NS",day:"Today",time:"21:00",ref:"P. Whitfield",att:"—",ev:[],fut:[]},

"Champions League":{rbu:[3,2,1,0,6,2],ngf:[3,2,0,1,5,3],hbc:[3,1,1,1,4,4],wlr:[3,1,0,2,3,5],rso:[3,2,1,0,7,3],cbr:[3,0,1,2,3,7]}};
/* ---------- helpers ---------- */
const S={st:"All",lg:"All",tl:"Premier League",tab:null};
const SL={LIVE:"Live",FT:"Finished",NS:"Scheduled"},IC={g:"⚽",y:"🟨",r:"🟥",s:"🔁"};
const cur=f=>f.st=="LIVE"?f.min:90;
const crest=(t,s=40)=>`<svg width="${s}" height="${s}" viewBox="0 0 40 40"><path d="M20 2 36 8v12c0 9-7 16-16 19C11 36 4 29 4 20V8z" fill="${t.c}"/><path d="M20 5 33 10v10c0 7-5 13-13 16" fill="none" stroke="#000" opacity=".15" stroke-width="2"/><text x="20" y="25" text-anchor="middle" font-size="11" font-weight="800" fill="${t.tc}" font-family="Inter,sans-serif">${t.s}</text></svg>`;
const status=f=>f.st=="LIVE"?`<span class="live"><i class="dot"></i>${f.min}′</span>`:f.st=="FT"?`<b>FT</b>`:`${f.day} · ${f.time}`;
const stand=L=>Object.entries(B[L]).map(([id,b])=>{let[p,w,d,l,gf,ga]=b;F.filter(f=>f.lg==L&&f.st!="NS"&&(f.h==id||f.a==id)).forEach(f=>{const m=f.h==id?f.hs:f.as,o=f.h==id?f.as:f.hs;p++;gf+=m;ga+=o;m>o?w++:m<o?l++:d++});return{id,p,w,d,l,gf,ga,gd:gf-ga,pts:w*3+d}}).sort((x,y)=>y.pts-x.pts||y.gd-x.gd||y.gf-x.gf);
const form=id=>(TM[id].form+F.filter(f=>f.st=="FT"&&(f.h==id||f.a==id)).map(f=>{const m=f.h==id?f.hs:f.as,o=f.h==id?f.as:f.hs;return m>o?"W":m<o?"L":"D"}).join("")).slice(-5);
const fb=s=>[...s].map(c=>`<span class="fb fb${c}">${c}</span>`).join("");
const evs=f=>{let h=0,a=0;return[...f.ev].sort((x,y)=>x[0]-y[0]).map(e=>{const[m,ty,sd,sl,as]=e,t=TM[sd=="h"?f.h:f.a];if(ty=="g")sd=="h"?h++:a++;
return{m,ty,sd,t,p:t.xi[sl],ap:as!=null?t.xi[as]:null,sub:ty=="s"?t.bench[sl%t.bench.length]:null,sc:h+"–"+a}})};
const etxt=e=>e.ty=="g"?`GOAL! ${e.t.n} score — ${e.p.n}${e.ap?` (assist: ${e.ap.n})`:""}. It is now ${e.sc}.`:e.ty=="y"?`Yellow card for ${e.p.n} (${e.t.s}) after a mistimed challenge.`:e.ty=="r"?`RED CARD! ${e.p.n} (${e.t.s}) is sent off — the referee has no hesitation.`:`Substitution ${e.t.s}: ${e.sub.n} replaces ${e.p.n}.`;
const comm=f=>{const h=TM[f.h],a=TM[f.a],c=cur(f);const fill=[[1,`Kick-off! ${h.n} get the game underway at ${h.v}.`],[8,`${h.s} settle into a rhythm with patient build-up down the left.`],[19,`Dangerous cross from ${a.s}, cleared at the near post for a corner.`],[31,`A strong tackle in midfield — the referee waves play on.`],[45,`Half-time. The teams head down the tunnel.`],[46,`We are back under way for the second half.`],[60,`${a.n} push higher up the pitch, looking for a way back in.`],[75,`The crowd at ${h.v} urge their side forward.`],[90,`Full-time. The referee blows the final whistle.`]].map(([m,x])=>({m,x,ty:"c"}));

const pn=p=>`<span class="font-semibold hov" style="display:inline-block;transform:none" data-go="#/player/${p.id}">${p.n}</span>`;

hub(){const l=F.find(f=>f.st=="LIVE"),list=F.filter(f=>(S.st=="All"||SL[f.st]==S.st)&&(S.lg=="All"||f.lg==S.lg));

<div class="flex gap-2 scroll pb-2 mb-2">${["All","Live","Finished","Scheduled"].map(v=>chip("st",v)).join("")}</div>
<div class="flex gap-2 scroll pb-3 mb-3">${["All","Premier League","Champions League"].map(v=>chip("lg",v)).join("")}</div>
<div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3">${list.map(card).join("")||`<p class="mut">No matches for this filter.</p>`}</div>`},
